<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#021a30" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<title>Materiais</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Mesmo visual da Ferramentaria (padrão rumolog.com): azul-marinho #043865, azul-claro #32a6e6, Open Sans. */
:root {
  --bg: #ebf0f2; --card: #ffffff; --ink: #2b3a48; --title: #043865; --muted: #5f7180; --line: #d3dde3;
  --bar: #ffffff; --bar-ink: #043865;
  --primary: #043865; --primary-ink: #ffffff;
  --accent: #32a6e6; --accent-ink: #ffffff;
  --ok: #138a6c; --ok-bg: #e1f4ee; --bad: #c62828; --bad-bg: #fdeaea; --warn: #c45a12; --warn-bg: #fff0e5;
  --toast: #043865;
  --radius: 6px; --radius-sm: 4px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #021a30; --card: #06294a; --ink: #e6eef5; --title: #ffffff; --muted: #9db3c6; --line: #16416a;
    --bar: #06294a; --bar-ink: #ffffff;
    --primary: #32a6e6; --primary-ink: #021a30;
    --ok: #4fd1a8; --ok-bg: #0c3a33; --bad: #ff7272; --bad-bg: #3d1a24; --warn: #f7a26b; --warn-bg: #3d2a1c;
    --toast: #32a6e6;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 "Open Sans", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bar); color: var(--bar-ink); border-bottom: 1px solid var(--line); padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 10px; }
header.top .logo { height: 20px; width: auto; color: var(--title); flex: none; }
header.top .divisor { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; }
.login-marca { text-align: center; margin: 28px 0 8px; color: var(--title); }
.login-marca .logo { height: 40px; width: auto; }
.login-marca div { font-size: 13px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
header.top h1 { font-size: 19px; margin: 0; flex: 1; font-weight: 800; letter-spacing: .1px; min-width: 0; }
header.top .sub { font-size: 12px; color: var(--muted); font-weight: 600; display: block; text-transform: uppercase; letter-spacing: .5px; }
header.top .sinc { font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: var(--bg); color: var(--title); border: 1px solid var(--line); white-space: nowrap; }
header.top .sinc.offline, header.top .sinc.erro { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
header.top button { background: none; border: 0; color: inherit; font-size: 26px; padding: 0 6px 0 0; line-height: 1; cursor: pointer; }
main { padding: 14px 16px; max-width: 720px; margin: 0 auto; }
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
nav.tabs a { flex: 1; text-align: center; padding: 9px 2px 10px; color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; border-top: 3px solid transparent; margin-top: -1px; position: relative; }
nav.tabs a svg { display: block; margin: 0 auto 3px; width: 24px; height: 24px; }
nav.tabs a.on { color: var(--title); border-top-color: var(--accent); }
nav.tabs a.on svg { color: var(--accent); }
nav.tabs a .bolha { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--bad); color: #fff; border-radius: 999px; font-size: 10px; padding: 1px 5px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.card h2 { font-size: 14px; margin: 0 0 10px; color: var(--title); text-transform: uppercase; letter-spacing: .6px; font-weight: 700; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--card); color: var(--title); font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn.big { width: 100%; min-height: 60px; font-size: 18px; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.full { width: 100%; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; }
.btn:disabled { opacity: .45; }
.row { display: flex; gap: 10px; align-items: center; }
.row > .grow, .grow { flex: 1; min-width: 0; }
.wrap { flex-wrap: wrap; }
.stack > * + * { margin-top: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.status { border-radius: 0; padding: 18px 18px 26px; margin-bottom: 12px; border: 0; border-left: 6px solid var(--line);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px)); }
.status.ok { background: var(--ok-bg); border-left-color: var(--ok); }
.status.bad { background: var(--bad-bg); border-left-color: var(--bad); }
.status.neutral { background: #32a6e6; color: #043865; border-left-color: #043865; }
.status.neutral .muted { color: #043865; }
.status .big { font-size: 22px; font-weight: 800; color: var(--title); }
.status.neutral .big { color: #043865; }
.status.ok .big { color: var(--ok); } .status.bad .big { color: var(--bad); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.kpis.k4 { grid-template-columns: repeat(2, 1fr); }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; }
.kpi b { display: block; font-size: 24px; font-weight: 800; color: var(--title); overflow-wrap: anywhere; }
.kpi span { font-size: 12px; color: var(--muted); }
label.f { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; min-height: 48px; }
input[type=checkbox] { width: 22px; min-height: 22px; height: 22px; flex: none; }
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
.li { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
.li:first-child { border-top: 0; }
.li .t { font-weight: 700; color: var(--title); }
.li .s { font-size: 13px; color: var(--muted); }
.li.est { opacity: .55; }
.li.est .t { text-decoration: line-through; }
.group-h { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--title); margin: 18px 4px 6px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.tag.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
.tag.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
.tag.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.qty { font-size: 20px; font-weight: 800; color: var(--title); text-align: right; white-space: nowrap; }
.qty small { font-size: 12px; font-weight: 600; color: var(--muted); }
.qty.bad { color: var(--bad); }
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl button { width: 46px; height: 46px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--bg); color: var(--title); font-size: 24px; font-weight: 700; cursor: pointer; }
.ctl input { width: 72px; text-align: center; font-size: 20px; font-weight: 800; height: 46px; min-height: 46px; padding: 0; }
.x { background: none; border: 0; color: var(--muted); font-size: 22px; padding: 4px 8px; cursor: pointer; }
.res { margin-top: 6px; }
.res .li { cursor: pointer; }
.sticky-foot { position: sticky; bottom: calc(68px + env(safe-area-inset-bottom)); background: var(--bg); padding: 10px 0 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.chips button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer; }
.chips button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
dialog { border: 0; border-top: 5px solid var(--accent); border-radius: var(--radius); padding: 0; width: min(560px, calc(100% - 24px)); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgba(0,0,0,.55); }
dialog .dh { padding: 16px 16px 0; font-size: 18px; font-weight: 800; color: var(--title); }
dialog .db { padding: 14px 16px; max-height: 70vh; overflow: auto; }
dialog .df { padding: 0 16px 16px; display: flex; gap: 10px; }
dialog .df .btn { flex: 1; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--toast); color: #fff; padding: 12px 18px; border-radius: var(--radius-sm); z-index: 50; font-weight: 600; max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 12px; }
.seg button { flex: 1; min-height: 46px; border: 0; background: var(--card); color: var(--title); font: inherit; font-weight: 700; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
/* Tabelas dos relatórios */
.tw { overflow-x: auto; }
table.tb { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tb th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 2px solid var(--line); white-space: nowrap; }
table.tb td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.tb td.n, table.tb th.n { text-align: right; white-space: nowrap; }
.barra { height: 8px; background: var(--accent); margin-top: 4px; min-width: 2px; }
.so-print { display: none; }
header.top .engr { color: var(--muted); width: 26px; height: 26px; flex: none; display: block; }
header.top .engr svg { width: 26px; height: 26px; }
nav.tabs a.so-pc { display: none; }
.progress { height: 6px; background: var(--line); overflow: hidden; margin: 8px 0 2px; }
.progress i { display: block; height: 100%; background: var(--accent); }
.cnt { padding: 12px 14px; border-top: 1px solid var(--line); }
.cnt:first-child { border-top: 0; }
.cnt .t { font-weight: 700; color: var(--title); }
.cnt .s { font-size: 13px; color: var(--muted); }
.cnt .top { display: flex; gap: 8px; align-items: flex-start; }
.ctl .same { height: 46px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px dashed var(--line); background: none; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
input.qin { width: 76px; min-height: 40px; padding: 6px 8px; text-align: right; font-weight: 700; }
tr.muted td { color: var(--muted); }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.cx { display: block; background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: var(--radius); padding: 10px 12px; color: inherit; text-decoration: none; }
.cx.bad { border-top-color: var(--bad); }
.cx .n { font-size: 26px; font-weight: 800; color: var(--title); line-height: 1.1; }
.cx .p { font-weight: 700; font-size: 14px; color: var(--title); }
.cx .s { font-size: 12px; margin: 2px 0 6px; }
.ctl .same { white-space: nowrap; }
.mob { color: var(--ink); }
.row.wrap > .btn.grow { flex: 1 1 calc(50% - 10px); }
table.tb a { color: var(--title); font-weight: 700; text-decoration: none; }
@media (min-width: 641px) { .mob { display: none; } }
@media (max-width: 640px) { .tb .pc { display: none; } }
@media (min-width: 900px) { nav.tabs a.so-pc { display: flex; } header.top .engr { display: none; } }

@media (min-width: 900px) {
  body { padding-bottom: 0; padding-left: 210px; }
  nav.tabs { top: 0; bottom: 0; right: auto; width: 210px; flex-direction: column; border-top: 0; border-right: 1px solid var(--line); padding: 72px 0 0; }
  nav.tabs a { flex: none; display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px 20px; font-size: 13px; border-top: 0; border-left: 3px solid transparent; margin-top: 0; }
  nav.tabs a svg { margin: 0; }
  nav.tabs a.on { border-left-color: var(--accent); background: var(--bg); }
  nav.tabs a .bolha { position: static; margin-left: auto; }
  main { max-width: 1100px; padding: 20px 28px; }
  .sticky-foot { bottom: 0; }
  .toast { bottom: 28px; }
  .kpis.k4 { grid-template-columns: repeat(4, 1fr); }
  .lado { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
}
@media print {
  @page { margin: 14mm; }
  body { padding: 0 !important; background: #fff; color: #000; font-size: 12px; }
  nav.tabs, header.top, .noprint, .toast { display: none !important; }
  .so-print { display: block; }
  main { max-width: none; padding: 0; }
  .card, .kpi { border-color: #bbb; break-inside: avoid; }
  .barra { background: #043865; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>

<body>
<header class="top" id="top"></header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<dialog id="dlg"></dialog>
<input type="file" id="arqBackup" accept="application/json,.json" hidden>

<script>
'use strict';
/* =========================================================================
   Materiais — gestão de materiais da equipe de manutenção de vagões
   (consumíveis, peças de reposição e EPI). App irmão da Ferramentaria:
   mesmos logins e níveis de acesso, mesma nuvem (tabelas mat_*).
   Fluxo: a equipe CONTA o estoque → o app calcula o consumo → na análise semanal
   o programador gera a RESERVA (padrão − saldo − já reservado) → registra o recebimento.
   Local primeiro: grava no aparelho na hora e sincroniza quando há internet.
   ========================================================================= */

const CHAVE = 'materiais_v1';
const TIPOS = ['Consumível', 'Peça de reposição', 'EPI'];
const STATUS_RES = { aberta: 'Aberta', parcial: 'Recebida em parte', recebida: 'Recebida', encerrada: 'Encerrada' };
const DIAS_CONTAGEM_VELHA = 7;

/* ---------- Armazenamento ---------- */
let versao = 0;  // muda a cada alteração: invalida o cálculo de saldos
const DB = {
  dados: null,
  vazio() {
    return {
      versao: 3,
      dispositivo: uid(),
      // caixas = [{id, numero, posto, ativa}]; equipe = ["Nome; CS123"]
      config: { unidade: '', caixas: Array.from({ length: 10 }, (_, k) => ({ id: 'cx' + p2(k + 1), numero: p2(k + 1), posto: '', ativa: true })), turnos: ['Turno A', 'Turno B', 'Turno C'], equipe: [],
        unidades: ['un', 'par', 'cx', 'pct', 'kg', 'm', 'L', 'rolo'] },
      itens: [],      // {id, codigo, nome, tipo, unidade, minimo, maximo, custo, ca, caValidade, obs, ativo, criadoEm, atualizadoEm} — todo item ativo existe em todas as caixas
      contagens: [],  // {id, caixaId, caixa, posto, turno, responsavel, matricula, iniciadaEm, fechadaEm, por, linhas:[{itemId, codigo, nome, unidade, anterior, contado, custo}], estorno?}
      reservas: [],   // {id, numero, criadaEm, por, obs, status, linhas:[{itemId, codigo, nome, unidade, qtd, recebido, custo, caixas:{caixaId: qtd}, recCaixas:{caixaId: qtd}}]}
      movs: [],       // abastecimento de caixa: {id, itemId, caixaId, tipo:'entrada', qtd, custo, reservaId, doc, obs, por, em, estorno?}
      rascunho: null  // contagem em andamento: fica só neste aparelho
    };
  },
  carregar() {
    try { this.dados = JSON.parse(localStorage.getItem(CHAVE)); } catch (e) { this.dados = null; }
    if (!this.dados || !this.dados.versao) this.dados = this.vazio();
    this.dados.config = Object.assign(this.vazio().config, this.dados.config || {});
    for (const k of ['itens', 'contagens', 'reservas', 'movs']) if (!Array.isArray(this.dados[k])) this.dados[k] = [];
    if (!Array.isArray(this.dados.config.caixas)) this.dados.config.caixas = [];
    // versões de teste anteriores (sem caixas): material com padrão vira máximo
    delete this.dados.carrinho; delete this.dados.config.setores;
    for (const i of this.dados.itens) if (i.maximo == null) { i.maximo = Number(i.padrao) || 0; i.minimo = Number(i.minimo) || 0; delete i.padrao; }
    this.dados.versao = 3;
    versao++;
  },
  salvar(semEnviar) {
    versao++;
    try { localStorage.setItem(CHAVE, JSON.stringify(this.dados)); }
    catch (e) { alert('Não foi possível salvar no aparelho: ' + e.message); }
    if (!semEnviar) Nuvem.agendar();
  }
};

function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
const agora = () => new Date().toISOString();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, el = document) => el.querySelector(s);
const p2 = (n) => String(n).padStart(2, '0');
function fmt(ts, comAno) {
  if (!ts) return '';
  const d = new Date(ts);
  return `${p2(d.getDate())}/${p2(d.getMonth() + 1)}${comAno ? '/' + d.getFullYear() : ''} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}
const fmtDia = (ts) => (ts ? fmt(ts, true).slice(0, 10) : '');
function fmtData(s) { if (!s) return ''; const [a, m, d] = s.slice(0, 10).split('-'); return `${d}/${m}/${a}`; }
function hoje() { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
const diasDesde = (ts) => Math.floor((Date.now() - new Date(ts)) / 86400000);
const r3 = (x) => Math.round(x * 1000) / 1000;
// Aceita "1,5" e "1.5"
function num(v) { if (v == null) return NaN; const s = String(v).trim().replace(/\s/g, '').replace(',', '.'); return s === '' ? NaN : Number(s); }
const fq = (x) => Number(x || 0).toLocaleString('pt-BR', { maximumFractionDigits: 3 });
const brl = (x) => Number(x || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
function toast(msg) {
  document.querySelectorAll('.toast').forEach((x) => x.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const quem = () => (Nuvem.sessao && Nuvem.sessao.email) || 'este aparelho';

/* ---------- Regras de negócio ---------- */
const D = () => DB.dados;
const itemPorId = (id) => D().itens.find((i) => i.id === id);
const ativos = () => D().itens.filter((i) => i.ativo !== false).sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
const caixas = () => D().config.caixas.filter((c) => c.ativa !== false);
const caixaPorId = (id) => D().config.caixas.find((c) => c.id === id);
const nomeCaixa = (c) => (c ? `Caixa ${c.numero}${c.posto ? ' · ' + c.posto : ''}` : 'Caixa removida');
const supervisor = () => !Nuvem.ativa() || Nuvem.sessao.papel === 'supervisor';
const SO_SUPERVISOR = new Set(['novo-item', 'editar-item', 'abastecer', 'importar', 'desativar', 'reativar', 'estornar', 'estornar-cont',
  'gerar-reserva', 'receber', 'numero-res', 'encerrar-res', 'salvar-cfg', 'backup', 'restaurar', 'apagar', 'sair']);
const contagensValidas = () => D().contagens.filter((c) => !c.estorno);
const K = (cx, it) => cx + '|' + it;

// Saldo de cada material EM CADA CAIXA = última contagem da caixa + abastecimentos registrados depois dela.
// Reservado = o que foi pedido para a caixa em reservas abertas e ainda não chegou.
let _calc = null, _calcV = -1;
function calc() {
  if (_calcV === versao) return _calc;
  const ult = {}, ultCx = {};
  for (const c of contagensValidas().sort((a, b) => (a.fechadaEm < b.fechadaEm ? -1 : 1))) {

// Divide o total pedido entre as caixas: primeiro o que cada caixa precisa; o que sobrar fica "sem caixa" (estoque)
function distribuir(total, porCaixa) {
  const o = {}; let resto = r3(total);
  for (const [cx, q] of Object.entries(porCaixa)) { if (resto <= 0) break; const x = Math.min(q, resto); o[cx] = r3(x); resto = r3(resto - x); }
  if (resto > 0) o._estoque = resto;
  return o;
}

/* --- Relatórios --- */
let rel = { periodo: '30d', de: '', ate: '', caixa: '' };
function intervalo() {
  const fim = new Date(); let ini = new Date();
  if (rel.periodo === '7d') { ini.setDate(ini.getDate() - 6); ini.setHours(0, 0, 0, 0); }
  else if (rel.periodo === '30d') { ini.setDate(ini.getDate() - 29); ini.setHours(0, 0, 0, 0); }
  else if (rel.periodo === '90d') { ini.setDate(ini.getDate() - 89); ini.setHours(0, 0, 0, 0); }
  else if (rel.periodo === 'mes') { ini = new Date(fim.getFullYear(), fim.getMonth(), 1); }
  else if (rel.periodo === 'mesant') { ini = new Date(fim.getFullYear(), fim.getMonth() - 1, 1); fim.setTime(new Date(fim.getFullYear(), fim.getMonth(), 1) - 1); }
  else {
    ini = rel.de ? new Date(rel.de + 'T00:00:00') : new Date(0);
    if (rel.ate) fim.setTime(new Date(rel.ate + 'T23:59:59.999'));
  }
  return [ini, fim];
}
const noPeriodo = (ts) => { const [a, b] = intervalo(); const t = new Date(ts); return t >= a && t <= b; };
// Linhas de consumo do período: {c, l, cons, valor}
function consumoPeriodo() {
  const r = [];
  for (const c of contagensValidas()) {
    if (!noPeriodo(c.fechadaEm) || (rel.caixa && c.caixaId !== rel.caixa)) continue;
    for (const l of c.linhas) { const cons = consumoLinha(l); if (cons) r.push({ c, l, cons, valor: cons * (l.custo || custoItem(l.itemId)) }); }
  }
  return r;
}
function agrupar(linhas, chave) {
  const g = {};
  for (const x of linhas) {
    const k = chave(x) || '(sem informação)';
    const y = g[k] ||= { k, qtd: 0, valor: 0, n: 0 };
    y.qtd += x.cons; y.valor += x.valor; y.n++;
  }
  return Object.values(g).map((y) => Object.assign(y, { qtd: r3(y.qtd) }));
}
function tabelaGrupo(titulo, linhas, comValor, rotulo) {
  if (!linhas.length) return '';
  const metr = (x) => (comValor ? x.valor : x.qtd);
  linhas.sort((a, b) => metr(b) - metr(a));
  const max = Math.max(...linhas.map(metr), 0) || 1;
  return `<div class="card"><h2>${titulo}</h2><div class="tw"><table class="tb"><thead><tr><th>${rotulo}</th><th class="n">Peças usadas</th>${comValor ? '<th class="n">Valor</th>' : ''}</tr></thead><tbody>
    ${linhas.map((x) => `<tr><td>${esc(x.k)}<div class="barra" style="width:${Math.max(0, metr(x)) / max * 100}%"></div></td><td class="n">${fq(x.qtd)}</td>${comValor ? `<td class="n">${brl(x.valor)}</td>` : ''}</tr>`).join('')}
    </tbody></table></div></div>`;
}

function salvarCaixas(txt) {
  const cfg = D().config;
  const vistos = new Set();
  for (const linha of txt.split('\n')) {
    if (!linha.trim()) continue;
    const [numero, ...resto] = linha.split(/[;\t]/).map((x) => x.trim());
    if (!numero || vistos.has(numero)) continue;
    vistos.add(numero);
    const posto = resto.join(' ').trim();
    const c = cfg.caixas.find((x) => x.numero === numero);
    if (c) { c.posto = posto; c.ativa = true; } else cfg.caixas.push({ id: uid(), numero, posto, ativa: true });
  }
  for (const c of cfg.caixas) if (!vistos.has(c.numero)) c.ativa = false;
  cfg.caixas.sort((a, b) => a.numero.localeCompare(b.numero, 'pt', { numeric: true }));
}
function restaurar(e) {
  const f = e.target.files[0]; if (!f) return;

  r.onload = () => {

    if (!d || !Array.isArray(d.itens)) return toast('Não é um backup do Materiais');
    modal({ titulo: 'Restaurar backup?', perigo: true, ok: 'Restaurar', corpo: `<p>${d.itens.length} materiais e ${(d.contagens || []).length} contagens substituirão os dados deste aparelho${Nuvem.ativa() ? ' e serão enviados à nuvem' : ''}.</p>`,

  };
  r.readAsText(f); e.target.value = '';
}

/* ---------- Nuvem (Supabase) ----------
   Mesmo mecanismo da Ferramentaria: grava no aparelho e envia quando há internet.
   Envio: só o que mudou (impressão digital por registro). Recebimento: pelo sinc_em do servidor.
   Conflito no mesmo registro: vale o último envio; estorno sempre prevalece. */
const SUPA_URL = 'https://blizyewnlcyaxizwlzdk.supabase.co';
const SUPA_KEY = 'sb_publishable_F82gpF8qtfC-cezTvYzEwQ_n0ZGAR4A';  // chave pública (segura com as regras de acesso)
const COLECOES = ['config', 'itens', 'movs', 'contagens', 'reservas'];
const TABELA = { config: 'mat_config', itens: 'mat_itens', movs: 'mat_movs', contagens: 'mat_contagens', reservas: 'mat_reservas' };

function estavel(v) {
  if (Array.isArray(v)) return '[' + v.map(estavel).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => JSON.stringify(k) + ':' + estavel(v[k])).join(',') + '}';
  return v === undefined ? 'null' : JSON.stringify(v);
}
function digital(obj) {
  const t = estavel(obj);
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < t.length; i++) { const c = t.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519); }
  return (h1 >>> 0).toString(36) + (h2 >>> 0).toString(36) + t.length.toString(36);
}

const Nuvem = {
  sessao: null, sinc: null, rodando: false, deNovo: false, timer: null, estado: 'ok', erro: '',
  carregar() {
    try { this.sessao = JSON.parse(localStorage.getItem('materiais_sessao')); } catch (e) { this.sessao = null; }
    try { this.sinc = JSON.parse(localStorage.getItem('materiais_sinc')); } catch (e) { this.sinc = null; }
    if (!this.sinc) this.sinc = { cursor: {}, enviado: {}, ultima: null };
    for (const c of COLECOES) this.sinc.enviado[c] = this.sinc.enviado[c] || {};
  },
  guardar() {
    try {
      localStorage.setItem('materiais_sessao', JSON.stringify(this.sessao));
      localStorage.setItem('materiais_sinc', JSON.stringify(this.sinc));
    } catch (e) {}
  },
  ativa() { return !!this.sessao; },
  precisaLogin() {
    let local = false;
    try { local = localStorage.getItem('materiais_modo') === 'local'; } catch (e) {}
    return this.sessao ? !!this.sessao.expirada : !local;
  },
  sair() {
    this.sessao = null; this.sinc = { cursor: {}, enviado: {}, ultima: null };
    for (const c of COLECOES) this.sinc.enviado[c] = {};
    this.guardar();
  },
  async auth(corpo, tipo) {
    const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=${tipo}`, { method: 'POST', headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(d.error_description || d.msg || d.message || 'Falha no login'); e.status = r.status; throw e; }
    this.sessao = { token: d.access_token, refresh: d.refresh_token, expira: Date.now() + d.expires_in * 1000, email: (d.user && d.user.email) || (this.sessao && this.sessao.email), papel: this.sessao && this.sessao.papel };
    this.guardar();
  },
  async token() {
    if (Date.now() > this.sessao.expira - 60000) {
      try { await this.auth({ refresh_token: this.sessao.refresh }, 'refresh_token'); }
      catch (e) { if (e.status === 400 || e.status === 401 || e.status === 403) { this.sessao.expirada = true; this.guardar(); } throw e; }
    }
    return this.sessao.token;
  },
  async api(caminho, opt = {}) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${caminho}`, Object.assign({}, opt, {
      headers: Object.assign({ apikey: SUPA_KEY, Authorization: 'Bearer ' + await this.token(), 'Content-Type': 'application/json' }, opt.headers || {})
    }));
    if (!r.ok) { const e = new Error(`${r.status} ${(await r.text()).slice(0, 200)}`); e.status = r.status; throw e; }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  },
  async carregarPapel() {
    let papel = this.sessao.papel || 'tecnico';
    try { const r = await this.api('perfis?select=papel'); papel = (r && r[0] && r[0].papel) || 'tecnico'; }
    catch (e) { if (e instanceof TypeError || (this.sessao && this.sessao.expirada)) throw e; }
    const mudou = this.sessao.papel !== papel;
    this.sessao.papel = papel; this.guardar();
    return mudou;
  },
  // Técnico só envia contagens sem estorno (a nuvem também recusa o resto)
  podeEnviar(col, obj) {
    if (this.sessao.papel === 'supervisor') return true;
    return col === 'contagens' && !!obj && !obj.estorno;
  },
  registros(col) {
    if (col === 'config') return [['config', D().config]];
    return D()[col].map((x) => [x.id, x]);
  },
  obter(col, id) { return col === 'config' ? D().config : D()[col].find((x) => x.id === id); },
  aplicar(col, id, dados) {
    versao++;
    if (col === 'config') { DB.dados.config = Object.assign(DB.vazio().config, dados); return; }
    const atual = D()[col].find((x) => x.id === id);
    if (atual) { for (const k of Object.keys(atual)) delete atual[k]; Object.assign(atual, dados); }
    else D()[col].push(dados);
  },
  contarPendentes() {
    if (!this.ativa()) return 0;
    let n = 0;
    for (const col of COLECOES) { const env = this.sinc.enviado[col]; for (const [id, obj] of this.registros(col)) if (this.podeEnviar(col, obj) && env[id] !== digital(obj)) n++; }
    return n;
  },
  receber(col, linha, primeira) {
    const env = this.sinc.enviado[col];
    const dRemoto = digital(linha.dados);
    const local = this.obter(col, linha.id);
    if (local) {
      const dLocal = digital(local);
      if (dLocal === dRemoto) { env[linha.id] = dRemoto; return false; }
      // Alterado aqui e ainda não enviado: o envio atualiza a nuvem (exceto: 1ª sincronização dos ajustes,
      // registros que este nível não envia, e estorno feito pelo supervisor, que sempre prevalece)
      if (env[linha.id] !== dLocal && !(col === 'config' && primeira) && this.podeEnviar(col, local) && !linha.dados.estorno) return false;
    }
    this.aplicar(col, linha.id, linha.dados);
    env[linha.id] = dRemoto;
    return true;
  },
  agendar(ms = 1500) {
    if (!this.ativa()) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.sincronizar(), ms);
  },
  async sincronizar() {
    if (!this.ativa() || this.sessao.expirada) return;
    if (this.rodando) { this.deNovo = true; return; }
    if (!navigator.onLine) { this.estado = 'offline'; this.mostrar(); return; }
    this.rodando = true; this.estado = 'enviando'; this.mostrar();
    let chegou = false;
    try {
      if (await this.carregarPapel()) chegou = true;
      for (const col of COLECOES) {
        const primeira = this.sinc.cursor[col] == null;
        const cursor = this.sinc.cursor[col] || 0;
        const desde = new Date(Math.max(0, cursor - 120000)).toISOString();
        let maior = cursor;
        for (let offset = 0; ; offset += 1000) {
          const linhas = await this.api(`${TABELA[col]}?select=id,dados,sinc_em&sinc_em=gte.${encodeURIComponent(desde)}&order=sinc_em.asc,id.asc&limit=1000&offset=${offset}`);
          for (const l of linhas) { if (this.receber(col, l, primeira)) chegou = true; maior = Math.max(maior, Date.parse(l.sinc_em)); }
          if (linhas.length < 1000) break;
        }
        this.sinc.cursor[col] = maior;
      }
      if (chegou) DB.salvar(true);
      for (const col of COLECOES) {
        const env = this.sinc.enviado[col];
        const lote = [];
        for (const [id, obj] of this.registros(col)) { if (!this.podeEnviar(col, obj)) continue; const d = digital(obj); if (env[id] !== d) lote.push({ id, d, corpo: JSON.stringify({ id, dados: obj, dispositivo: D().dispositivo }) }); }
        for (let i = 0; i < lote.length; i += 200) {
          const parte = lote.slice(i, i + 200);
          await this.api(`${TABELA[col]}?on_conflict=id`, { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: '[' + parte.map((x) => x.corpo).join(',') + ']' });
          for (const x of parte) env[x.id] = x.d;
        }
      }
      this.sinc.ultima = agora();
      this.estado = 'ok'; this.erro = '';
    } catch (e) {
      this.estado = !navigator.onLine || e instanceof TypeError ? 'offline' : 'erro';
      this.erro = e.message;
      if (this.sessao && this.sessao.expirada) { this.guardar(); this.rodando = false; render(); return; }
    }
    this.guardar();
    this.rodando = false;
    this.mostrar();
    const ae = document.activeElement;
    if (chegou && !$('#dlg').open && !(rota().nome === 'contar' && D().rascunho) && !(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) render();
    if (this.deNovo) { this.deNovo = false; this.agendar(300); }
  },
  textoEstado() {
    const n = this.contarPendentes();
    const ult = this.sinc.ultima ? 'Última sincronização: ' + fmt(this.sinc.ultima) : 'Ainda não sincronizado';
    if (this.estado === 'offline') return `Sem internet. ${n} alteração(ões) serão enviadas quando o sinal voltar.`;
    if (this.estado === 'erro') return `Erro ao sincronizar (${this.erro.slice(0, 80)}). ${n} pendente(s).`;
    if (this.estado === 'enviando') return 'Sincronizando…';
    return `${ult}.${n ? ` ${n} pendente(s).` : ' Tudo salvo na nuvem.'}`;
  },
  mostrar() {
    const el = document.getElementById('sincSt');
    if (!el) return;
    const n = this.estado === 'enviando' ? 0 : this.contarPendentes();
    el.className = 'sinc ' + this.estado;
    el.textContent = this.estado === 'enviando' ? '☁ ↻' : this.estado === 'offline' ? `☁ sem sinal${n ? ' · ' + n : ''}` : this.estado === 'erro' ? '☁ ⚠' : n ? `☁ ${n}` : '☁ ✓';
  }
};

  $('#app').innerHTML = `
    <div style="max-width:460px;margin:0 auto">
    <div class="login-marca">${LOGO_RUMO}<div>GESTÃO DE MATERIAIS - REVISTAMENTO ZTO</div></div>
    <div class="card stack" style="margin-top:16px">
      <div style="font-size:20px;font-weight:800">${exp ? 'Entre de novo' : 'Entrar na conta da equipe'}</div>
      <p class="small muted" style="margin:0">${exp ? 'A sessão expirou. Os dados deste aparelho estão guardados e serão enviados ao entrar.' : 'Use o mesmo login da Ferramentaria. Os dados ficam na nuvem e o app funciona sem internet.'}</p>
      <div><label class="f" for="lgEmail">E-mail</label><input id="lgEmail" type="email" autocomplete="username" inputmode="email" value="${esc(Nuvem.sessao ? Nuvem.sessao.email : '')}"></div>
      <div><label class="f" for="lgSenha">Senha</label><input id="lgSenha" type="password" autocomplete="current-password"></div>
      <button class="btn big primary" data-a="entrar">Entrar</button>
      ${exp ? '' : '<button class="btn full" data-a="modo-local">Usar sem nuvem (só neste aparelho)</button>'}
    </div></div>`;
  $('#lgSenha').addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });
}
async function entrar() {
  const email = $('#lgEmail').value.trim(), senha = $('#lgSenha').value;
  if (!email || !senha) return toast('Informe e-mail e senha');
  if (!navigator.onLine) return toast('É preciso internet para entrar');
  const b = $('[data-a=entrar]'); b.disabled = true; b.textContent = 'Entrando…';
  try {
    await Nuvem.auth({ email, password: senha }, 'password');
    try { localStorage.removeItem('materiais_modo'); } catch (e) {}
    ir('inicio'); render();
    toast('Conectado. Sincronizando…');
    await Nuvem.sincronizar();
    toast(Nuvem.estado === 'ok' ? 'Dados sincronizados com a nuvem' : Nuvem.textoEstado());
    render();
  } catch (e) {
    b.disabled = false; b.textContent = 'Entrar';
    toast(e.status === 400 ? 'E-mail ou senha incorretos' : e instanceof TypeError ? 'Sem conexão com a nuvem' : 'Erro: ' + e.message);
  }
}
function trocarLogin() {
  if (!navigator.onLine) return toast('É preciso internet para trocar de login');
  modal({
    titulo: 'Trocar de login',
    corpo: `<div class="stack">
      <p class="small muted" style="margin:0">Agora: <b>${esc(Nuvem.sessao.email)}</b> (${supervisor() ? 'Supervisor' : 'Técnico'}). Os dados do aparelho continuam; muda só o que este login pode fazer.</p>
      <div><label class="f" for="tlEmail">E-mail</label><input id="tlEmail" type="email" inputmode="email" autocomplete="username"></div>
      <div><label class="f" for="tlSenha">Senha</label><input id="tlSenha" type="password" autocomplete="current-password"></div></div>`,
    ok: 'Entrar',
    validar(dlg) { if (!dlg.querySelector('#tlEmail').value.trim() || !dlg.querySelector('#tlSenha').value) { toast('Informe e-mail e senha'); return false; } return true; },
    async aoConfirmar(dlg) {
      const email = dlg.querySelector('#tlEmail').value.trim(), senha = dlg.querySelector('#tlSenha').value;
      toast('Entrando…');
      await Nuvem.sincronizar();
      const anterior = Nuvem.sessao;
      try { Nuvem.sessao = Object.assign({}, anterior, { papel: null }); await Nuvem.auth({ email, password: senha }, 'password'); }
      catch (e) { Nuvem.sessao = anterior; Nuvem.guardar(); return toast(e.status === 400 ? 'E-mail ou senha incorretos' : 'Não foi possível entrar: ' + e.message); }
      await Nuvem.sincronizar();
      toast(`Conectado como ${Nuvem.sessao.email} (${supervisor() ? 'Supervisor' : 'Técnico'})`);
      render();
    }
  });
  setTimeout(() => { const i = $('#tlEmail'); if (i) i.focus(); }, 50);
}

/* ---------- Modal genérico ---------- */
function modal({ titulo, corpo, ok = 'OK', cancelar = 'Cancelar', perigo, validar, aoConfirmar, aoAbrir }) {
  const velho = $('#dlg');
  if (velho.open) velho.close();
  const dlg = velho.cloneNode(false);
  velho.replaceWith(dlg);
  dlg.innerHTML = `<div class="dh">${esc(titulo)}</div><div class="db">${corpo}</div>
    <div class="df">${cancelar ? `<button class="btn" data-m="x">${esc(cancelar)}</button>` : ''}<button class="btn ${perigo ? 'danger' : 'primary'}" data-m="ok">${esc(ok)}</button></div>`;
  dlg.onclick = (e) => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    if (b.dataset.m === 'x') return dlg.close();
    if (validar && !validar(dlg)) return;
    dlg.close();
    aoConfirmar && aoConfirmar(dlg);
  };
  aoAbrir && aoAbrir(dlg);
  dlg.showModal();
}



/* ---------- Ações ---------- */
const ACOES = {
  voltar: () => (history.length > 1 ? history.back() : ir('inicio')),
  ir: (el) => ir(el.dataset.h),
  'novo-item': () => formItem(null),
  'editar-item': (el) => formItem(itemPorId(el.dataset.i)),
  abastecer: (el) => formAbastecer(el.dataset.c),
  'contar-caixa': (el) => { if (D().rascunho) return ir('contar'); ir('contar/' + encodeURIComponent(el.dataset.c)); },
  importar: formImportar,
  estornar: (el) => formEstornar(D().movs.find((m) => m.id === el.dataset.m)),
  'estornar-cont': (el) => formEstornarContagem(D().contagens.find((c) => c.id === el.dataset.c)),
  desativar: (el) => {
    const i = itemPorId(el.dataset.i);
    modal({ titulo: 'Desativar material?', perigo: true, ok: 'Desativar', corpo: `<p><b>${esc(i.nome)}</b> sai das caixas, das contagens e da análise de reserva. O histórico continua. Dá para reativar depois.</p>`,
      aoConfirmar() { i.ativo = false; i.atualizadoEm = agora(); DB.salvar(); render(); } });
  },
  reativar: (el) => { const i = itemPorId(el.dataset.i); i.ativo = true; i.atualizadoEm = agora(); DB.salvar(); toast('Material reativado'); render(); },
  'iniciar-cont': () => {
    const cx = $('#cCaixa .on'), tu = $('#cTurno .on');
    if (!cx) return toast('Escolha a caixa');
    if (!tu) return toast('Escolha o turno');
    const sel = $('#cResp');
    let nome, matricula;
    if (sel && sel.value && sel.value !== '__outro') ({ nome, matricula } = pessoa(sel.value));
    else { nome = $('#cNome').value.trim(); matricula = $('#cMat').value.trim().toUpperCase(); }
    if (!nome) return toast('Informe quem está contando');
    if (!matricula) return toast('Informe a matrícula');
    D().rascunho = { id: uid(), caixaId: cx.dataset.v, turno: tu.dataset.v, responsavel: nome, matricula, iniciadaEm: agora(), contagens: {} };
    DB.salvar(true); ir('contar'); render();
  },
  'cancelar-cont': () => modal({ titulo: 'Descartar contagem?', corpo: '<p>As quantidades digitadas até agora serão perdidas.</p>', ok: 'Descartar', perigo: true, aoConfirmar() { D().rascunho = null; filtroCont = ''; DB.salvar(true); render(); } }),
  'fechar-cont': fecharContagem,
  menos: (el) => { const id = el.closest('.cnt').dataset.item; const c = D().rascunho.contagens[id]; setContagem(id, c == null ? 0 : Math.max(0, c - 1)); },
  mais: (el) => { const id = el.closest('.cnt').dataset.item; const c = D().rascunho.contagens[id]; setContagem(id, c == null ? 1 : c + 1); },
  igual: (el) => { const id = el.closest('.cnt').dataset.item; setContagem(id, saldo(D().rascunho.caixaId, id)); },
  'compartilhar-cont': (el) => compartilharTexto(textoContagem(D().contagens.find((c) => c.id === el.dataset.c))),
  'gerar-reserva': gerarReserva,
  'sug-limpar': () => { sugEditada = {}; VIEWS.reserva(); },
  receber: (el) => formReceber(D().reservas.find((r) => r.id === el.dataset.r)),
  'numero-res': (el) => {
    const r = D().reservas.find((x) => x.id === el.dataset.r);
    modal({ titulo: 'Nº da reserva no SAP', ok: 'Salvar', corpo: `<input id="rNum2" inputmode="numeric" value="${esc(r.numero || '')}">`,
      aoAbrir(dlg) { setTimeout(() => dlg.querySelector('#rNum2').focus(), 50); },
      aoConfirmar(dlg) { r.numero = dlg.querySelector('#rNum2').value.trim(); DB.salvar(); render(); } });
  },
  'encerrar-res': (el) => {
    const r = D().reservas.find((x) => x.id === el.dataset.r);
    modal({ titulo: 'Encerrar reserva?', ok: 'Encerrar', perigo: true,
      corpo: `<p class="small">O que não chegou deixa de constar como reservado e volta a aparecer na sugestão da próxima análise.</p><label class="f" for="encMot">Motivo</label><input id="encMot" placeholder="Ex.: item cancelado no SAP">`,
      aoConfirmar(dlg) { r.status = 'encerrada'; r.encerrada = { por: quem(), em: agora(), motivo: dlg.querySelector('#encMot').value.trim() }; DB.salvar(); toast('Reserva encerrada'); render(); } });
  },
  'compartilhar-res': (el) => compartilharTexto(textoReserva(D().reservas.find((r) => r.id === el.dataset.r))),
  'csv-res': (el) => exportarReserva(D().reservas.find((r) => r.id === el.dataset.r)),
  'rel-csv': exportarConsumo,
  'estoque-csv': exportarEstoque,
  imprimir: () => window.print(),
  'rel-resumo': () => compartilharTexto(resumoTexto()),
  'salvar-cfg': () => {
    const linhas = (s) => [...new Set($(s).value.split('\n').map((x) => x.trim()).filter(Boolean))];
    const cfg = D().config;
    cfg.unidade = $('#cfUn').value.trim();
    salvarCaixas($('#cfCx').value);
    cfg.turnos = linhas('#cfTur'); if (!cfg.turnos.length) cfg.turnos = ['Turno A', 'Turno B', 'Turno C'];
    cfg.equipe = linhas('#cfEq').map((p) => { const x = pessoa(p); return x.nome + (x.matricula ? '; ' + x.matricula.toUpperCase() : ''); }).sort((a, b) => a.localeCompare(b, 'pt'));
    const un = [...new Set($('#cfUnid').value.split(',').map((x) => x.trim()).filter(Boolean))];
    if (un.length) cfg.unidades = un;
    DB.salvar(); toast('Ajustes salvos'); render();
  },
  entrar: () => entrar(),
  'modo-local': () => modal({ titulo: 'Usar sem nuvem?', corpo: '<p>Os dados ficarão só neste aparelho. Dá para entrar na conta depois, em Ajustes; o que estiver aqui sobe junto.</p>', ok: 'Usar sem nuvem',
    aoConfirmar() { try { localStorage.setItem('materiais_modo', 'local'); } catch (e) {} render(); } }),
  'ir-login': () => { try { localStorage.removeItem('materiais_modo'); } catch (e) {} render(); },
  'sinc-agora': async () => { await Nuvem.sincronizar(); toast(Nuvem.estado === 'ok' ? 'Sincronizado' : Nuvem.textoEstado()); render(); },
  'sinc-info': () => toast(Nuvem.textoEstado()),
  'trocar-login': trocarLogin,
  sair: async () => {
    if (navigator.onLine) await Nuvem.sincronizar();
    const n = Nuvem.contarPendentes();
    modal({ titulo: 'Sair da conta neste aparelho?', perigo: true, ok: 'Sair',
      corpo: `<p>Os dados continuam salvos na nuvem; a cópia deste aparelho será apagada.</p>${n ? `<p style="color:var(--bad)"><b>Atenção:</b> ${n} alteração(ões) ainda não foram enviadas e serão perdidas.</p>` : ''}${D().rascunho ? '<p>A contagem em andamento será descartada.</p>' : ''}`,
      aoConfirmar() { const disp = D().dispositivo; DB.dados = DB.vazio(); DB.dados.dispositivo = disp; DB.salvar(true); Nuvem.sair(); ir('inicio'); render(); } });
  },
  backup: () => baixar(`materiais-backup-${hoje()}.json`, JSON.stringify(D(), null, 1), 'application/json'),
  restaurar: () => $('#arqBackup').click(),
  apagar: () => modal({ titulo: 'Apagar todos os dados?', corpo: '<p>Materiais, caixas, contagens, reservas e ajustes deste aparelho serão apagados. <b>Não dá para desfazer.</b> Faça um backup antes.</p>', ok: 'Apagar tudo', perigo: true,
    aoConfirmar() { DB.dados = DB.vazio(); DB.salvar(); toast('Dados apagados'); ir('inicio'); render(); } })
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el || el.tagName === 'INPUT' || el.closest('dialog')) return;
  const fn = ACOES[el.dataset.a];
  if (fn && SO_SUPERVISOR.has(el.dataset.a) && !supervisor()) { e.preventDefault(); return toast('Somente o supervisor pode fazer isso'); }
  if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.cq != null) setContagem(t.dataset.cq, t.value);
  else if (t.dataset.sug != null) {
    const v = num(t.value);
    sugEditada[t.dataset.sug] = v > 0 ? r3(v) : 0;
    const pos = window.scrollY; VIEWS.reserva(); window.scrollTo(0, pos);
  }
});
$('#arqBackup').addEventListener('change', restaurar);
window.addEventListener('hashchange', render);

/* ---------- Início ---------- */
DB.carregar();
Nuvem.carregar();
render();
Nuvem.sincronizar();
window.addEventListener('online', () => Nuvem.sincronizar());
window.addEventListener('offline', () => { Nuvem.estado = 'offline'; Nuvem.mostrar(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Nuvem.sincronizar(); });
setInterval(() => { if (document.visibilityState === 'visible') Nuvem.sincronizar(); }, 60000);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
